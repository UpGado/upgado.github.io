<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" >
  <title>Report</title>
  <style type="text/css">
.box{
	border:1px solid #CCC;
	margin: 10px;
  }
.left{
	float:left;
}
.right{
	float:right;
}
.table_std
    {
    table-layout:fixed;
    border-collapse:collapse;
	margin: 0.5em 2.5em 0.5em 1.5em;
    }
.table_std td
    {
	padding-bottom:0.5em;
	}
.table_power
    {
	border-collapse:collapse;
	text-align:left;
	margin:1em 1.5em;
	}
	
.table_power th
    {
	font-size: 14px;
	font-weight:normal;
	color: #003C6D;
	border-bottom: 1px solid #666;
	padding: 0em 1.4em 0.5em 0;
	}
.table_power td {
	padding: 0.8em 0 0.8em 0;
	font-weight:normal;
	border-bottom:1px solid #ccc;
}
td.rowtitle {
	font-weight:bold;
	min-width:10em;
}

html {
	margin:0;
	padding:0;
}
body {
    font-size: 83.33%%;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: normal;
    font-style: normal;
    color: black;
    background-color: white;
    line-height: 1.2em;
    margin: 0;
	padding:0;
   }

/* paragraphs */
p  {
    padding: 0;
    margin-top: 1em;
    margin-bottom: 1em;
    text-align: left;
   }

/* headings */
h1 {
    font-size: 180%%;
    font-weight: bold;
    font-style: normal;
    color: #0080c0;
    font-variant: small-caps;
    text-align: left;
    padding: 0;
    margin-top: 1.7em;
    margin-bottom: 1.7em;
   }
h2 {
    font-size: 150%%;
    font-weight: bold;
    font-style: normal;
    color: #0080c0;
    padding: 0;
    margin-top: 1.5em;
    margin-bottom: 1.1em;
   }
h3 {
    font-size: 130%%;
    font-weight: bold;
    font-style: normal;
    color: #0080c0;
    padding: 0.8em 1em;
	margin:0;
	text-transform:uppercase;
	background:#EDEDED;
	border-bottom: 1px solid #CCC;
   }
h4 {
    font-size: 110%%;
    font-weight: bold;
    font-style: normal;
    padding: 0;
    margin-top: 1.1em;
    margin-bottom: 1.1em;
   }
h5 {
    font-size: 100%%;
    font-weight: bold;
    font-style: italic;
    padding: 0;
    margin-top: 1em;
    margin-bottom: 1em;
   }
h6 {
    font-size: 100%%;
    font-weight: normal;
    font-style: italic;
    padding: 0;
    margin-top: 1em;
    margin-bottom: 1em;
   }

/* divisions */
div {
    padding: 0;
    margin-top: 0em;
    margin-bottom: 0em;
   }

/* lists */
ul, ol {
    padding: 0 0 0 3em;
    margin-top: 1em;
    margin-bottom: 1em;
   }
ul ul, ol ol, ul ol, ol ul {
    margin-top: 1em;
    margin-bottom: 1em;
   }
li {
    padding: 0;
    margin-top: 1em;
    margin-bottom: 1em;
    text-align: left;
   }
li p {
    margin-top: 1em;
    margin-bottom: 1em;
   }
dl {
    padding: 0;
    margin-top: 1em;
    margin-bottom: 1em;
    margin-left: 1em;
   }
dl dl {
    margin-top: 0em;
    margin-bottom: 0em;
   }
dt {
    padding: 0;
    font-weight: bold;
    margin-top: .3em;
    margin-bottom: .3em;
   }
dd {
    padding: 0;
    margin-top: .3em;
    margin-left: 3em;
    margin-bottom: .3em;
   }
dl p {
    margin-top: .3em;
    margin-bottom: .3em;
   }

/* inline */
strong {
    font-weight: bold;
   }
em {
    font-style: italic;
   }
code {
    font-family: Courier New, Courier, monospace;
   }
ins {
    background-color: yellow;
    text-decoration: underline;
   }
del {
    text-decoration: line-through;
   }

/* anchors */
a[href] {
    color: blue;
    text-decoration: underline;
   }

/* end */
  </style>
</head>

<body>
<div class="left">
<div class="box">
<h3>Settings</h3>

    <table class="table_std">
      <tbody>
        <tr>
          <td class="rowtitle">Flow Channel</td>
          <td>%1%</td>
        </tr>
        <tr>
          <td class="rowtitle">Volume Channel</td>
          <td>%2%</td>
        </tr>
        <tr>
          <td class="rowtitle">Cycle Detection</td>
          <td>%3%%% full range</td>
        </tr>
        <tr>
          <td class="rowtitle">Forced Expiration</td>
          <td>%4% x average volume</td>
        </tr>
      </tbody>
    </table>
</div>
<div class="box">
<h3>Selection</h3>

      <table class="table_std">
        <tbody>
          <tr>
            <td class="rowtitle">Selection Start</td>
            <td>Block: %5%, %6%</td>
          </tr>
          <tr>
            <td class="rowtitle">Selection End</td>
            <td>Block: %7%, %8%</td>
          </tr>
          <tr>
            <td class="rowtitle">Analysis Start</td>
            <td>%9%</td>
          </tr>
          <tr>
            <td class="rowtitle">Analysis End</td>
            <td>%10%</td>
          </tr>
        </tbody>
      </table>
</div>
%11%
%12%
</div>
</body>
</html>
